name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Export Supabase env
        run: |
          set -euo pipefail
          # Use env format output which is more stable across versions
          supabase status -o env > .env.supabase

          # Extract the required values
          supabase_url=$(grep 'API_URL=' .env.supabase | cut -d '=' -f2- | tr -d '"')
          supabase_anon_key=$(grep 'ANON_KEY=' .env.supabase | cut -d '=' -f2- | tr -d '"')

          if [ -z "$supabase_url" ] || [ -z "$supabase_anon_key" ]; then
            echo "Failed to extract Supabase credentials" >&2
            cat .env.supabase
            exit 1
          fi

          echo "NEXT_PUBLIC_SUPABASE_URL=$supabase_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$supabase_anon_key" >> "$GITHUB_ENV"

      - name: Create test user
        run: |
          # Extract DB_URL from supabase status and run SQL directly via psql
          db_url=$(grep 'DB_URL=' .env.supabase | cut -d '=' -f2- | tr -d '"')
          psql "$db_url" -f e2e/setup-test-user.sql

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm test:e2e
