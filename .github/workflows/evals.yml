name: Evals (OCR)

on:
  schedule:
    - cron: '0 18 * * *'  # 03:00 JST nightly
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/mastra/**'
      - 'lib/application/ocr/**'
      - 'lib/infrastructure/ocr/**'
      - 'evals/**'

jobs:
  ocr-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run OCR evals
        run: pnpm eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_PASS_THRESHOLD: '0.9'
          EVAL_CONCURRENCY: '4'

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/*.jsonl
          retention-days: 30
